; PlatformIO Project Configuration File for ESP32-WROOM Bluetooth Audio
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
upload_port = COM6
upload_speed = 115200
upload_flags =
    --before=no-reset
    --after=no-reset
monitor_port = COM6
monitor_speed = 115200
lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git
    https://github.com/pschatzmann/codec-shine.git
